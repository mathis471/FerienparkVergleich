name: Unpack project ZIP

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project
        run: |
          mkdir -p extracted
          unzip -q ferienpark-vergleich.zip -d extracted

          if [ -d "extracted/ferienpark-vergleich" ]; then
            cp -R extracted/ferienpark-vergleich/. .
          else
            cp -R extracted/. .
          fi

          rm -rf extracted
          rm -f ferienpark-vergleich.zip
          rm -f .github/workflows/unpack.yml

      - name: Commit project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Add FerienparkFinder project"
          git push
